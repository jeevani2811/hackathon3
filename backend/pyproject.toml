[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagent-backend"
version = "1.0.0"
description = "OmniAgent Multi-Agent Intelligent Systems Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "psutil>=5.9.8"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
